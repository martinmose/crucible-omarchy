SYSTEM_UTILS=(
  chezmoi
  yazi
  tmux
  rclone
  tree
  zsh
  starship
  wl-clipboard
  glow
  bind # for dig
  freeze-bin # charm freeze: code/terminal screenshots (no bare "freeze" pkg)
  tldr
  atuin

  # System monitoring
  nvtop
  s-tui

  # Sensors
  lm_sensors

  # Network and services
  tailscale
  syncthing

  # Danish keyboard support for åæø
  keyd

  # Git credential management
  # NOTE: use the -bin package. The source git-credential-manager(-extras)
  # PKGBUILD targets .NET 10 but declares dotnet-sdk-8.0, so it fails to build
  # (NETSDK1045) and aborts this set -e setup. -extras only shipped unused .so
  # libs, so it is intentionally dropped.
  git-credential-manager-bin

  # For VPN like Proton
  wireguard-tools
  systemd-resolvconf

  # pass is used for git git-credential-manager gpg
  pass
)

AI_TOOLS=(
  # Prebuilt Vulkan build for GPU acceleration (NVIDIA/AMD). On CPU-only
  # machines, swap for llama.cpp-bin (portable, no GPU). For fastest NVIDIA
  # performance, use llama.cpp-cuda (builds from source).
  llama.cpp-vulkan-bin
)

# Omarchy 4 manages coding agents through mise rather than Arch packages.
# Entries are "<mise package> [command-name]". Keep Pi npm-backed: this was
# selected to work around background subagent failures with standalone Pi.
# Do not remove the workaround without an end-to-end subagent smoke test.
# New personally owned portable tools belong in dotfiles' mise fragment instead.
# See ~/.dotfiles/docs/tool-management.md for installation ownership.
MISE_AI_TOOLS=(
  "npm:@earendil-works/pi-coding-agent pi"
  opencode
)

# Packages previously installed by Crucible that conflict with their replacements.
LEGACY_PACKAGES=(
  pi-coding-agent
  opencode-bin
  herdr-bin
  lmstudio
  nerd-fonts-fira-code
)

DEV_TOOLS_LANGUAGES=(
  go
  rustup

  npm
  pnpm # also installs nodejs
  uv # Python toolchain + package manager

  k9s
  hunk-bin
  herdr
  ast-grep-bin
  tuicr
  fizzy-cli-bin # Basecamp Fizzy boards/cards CLI
)

# Rootless containers. Podman replaces the Omarchy default Docker daemon so
# container commands work without sudo or the docker group (agents can test
# things). podman-compose backs `podman compose`; podman-desktop is the GUI.
# Post-install wiring (user socket, restart unit, linger) is done in
# scripts/install-additions.sh. See docs/podman-setup.md.
CONTAINER_TOOLS=(
  podman
  podman-compose
  podman-desktop
)

DEV_TOOLS_ANDROID=(
  android-studio
  ktlint
)

DEV_TOOLS_NVIM=(
  tree-sitter-cli
  chafa
)

VOICE_TOOLS=(
  voxtype-bin
)

# Elgato hardware. Optional, since it only makes sense on machines with a
# Stream Deck or an Elgato XLR interface (Wave XLR / XLR Dock). OpenDeck is
# the Stream Deck controller; OpenXLR is the control suite and PipeWire
# submixer for the XLR interfaces and ships an OpenDeck plugin, which the
# install script copies into ~/.config/opendeck/plugins. See docs/elgato-setup.md.
ELGATO_TOOLS=(
  opendeck-bin
  openxlr
)

# Optional: fan/pump control (coolercontrold is enabled when installed)
COOLING_TOOLS=(
  coolercontrol-bin
  liquidctl
)

# Thermal Grizzly WireView Pro II GPU power monitor. Optional, since it only
# makes sense on machines with the device on the GPU power cable. wireviewd
# reads it over USB serial and feeds the wireview_hwmon kernel module (built
# by DKMS), so per-pin readings show up in `sensors` and /sys/class/hwmon.
# The install script enables wireviewd. See docs/wireview-setup.md.
WIREVIEW_TOOLS=(
  wireview-hwmon
  wireview-hwmon-dkms
)

APPLICATIONS=(
  1password-cli
  brave-bin # used for webapps
  brave-origin-bin
  proton-mail-bin # Proton Mail + Calendar
  proton-meet-bin
  slack-desktop
  discord
  tabularis-bin
  lmstudio-bin
  grok-bot-bin # Grok desktop agent
  ttf-firacode-nerd
)

# Optional 4th field: custom launch command. webapp-brave (dotfiles) opens the
# app in brave instead of the default browser (brave-origin).
WEBAPPS=(
  "Microsoft Teams|https://teams.cloud.microsoft/|https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/microsoft-teams.png|webapp-brave https://teams.cloud.microsoft/"
  "Microsoft Outlook|https://outlook.office.com/mail/|https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/microsoft-outlook.png|webapp-brave https://outlook.office.com/mail/"
)

SERVICES=(
  tailscaled
)

USER_SERVICES=(
  voxtype
  syncthing
)

# pnpm global packages to install
PNPM_PACKAGES=(
  "codeburn"
)

# Cargo packages to install
CARGO_PACKAGES=(
  "cargo-ndk"
)
