# Omarchy 4 shell plugins (bar widgets, panels, services) to install.
#
# Format:  "plugin-id|git-url|scope|post-install"
#
#   plugin-id     The "id" from the plugin's manifest.json. Used to detect an
#                 existing install under ~/.config/omarchy/plugins/<id>.
#   git-url       Repo passed to `omarchy plugin add`.
#   scope         all      -> installed on every machine without asking
#                 optional -> prompted with [y/N] so machines can skip it
#   post-install  (optional) script inside the plugin dir to run once after
#                 a fresh install, e.g. "setup". Leave empty for none.
#
# Plugins are enabled after install and placed in the bar section their
# manifest declares as default. Update installed plugins with:
#   omarchy plugin update
PLUGINS=(
  # Listening ports / dev servers in the bar, with a kill button per row.
  "zeru.portwatch|https://github.com/ZerubbabelT/portwatch.git|all|"

  # AirPods battery and listening modes. Optional: only useful on machines
  # with Bluetooth and AirPods. "setup" builds the bundled librepods daemon
  # into ~/.local and enables librepods.service (pulls in cmake, ninja and
  # a few qt6 packages).
  "io.github.thisisgm.omapods|https://github.com/thisisgm/omarchy-pods.git|optional|setup"
)
