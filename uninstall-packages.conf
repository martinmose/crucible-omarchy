# Packages to remove from fresh and upgraded Omarchy installations
PACKAGES=(
  "typora"
  "typora-debug"
  "dropbox-cli"
  "dropbox"
  "zoom"
  "clipse"
  "clipse-debug"
  "rust"
  "aether"
  "code"
  "alacritty"
  # Docker is replaced by rootless Podman (docs/podman-setup.md). Omarchy's
  # Windows VM and "Docker DB" installer need the root daemon and stop working.
  # ufw-docker depends on docker so it goes at the same time. The uninstall
  # script disables docker.socket before pacman removes the unit.
  "ufw-docker"
  "docker"
  "docker-buildx"
  "docker-compose"
)

# Omarchy web apps to remove (desktop files)
WEBAPPS=(
  "Basecamp.desktop"
  "Discord.desktop"
  "Google Contacts.desktop"
  "Google Maps.desktop"
  "Google Messages.desktop"
  "Google Photos.desktop"
  "HEY.desktop"
  "WhatsApp.desktop"
  "X.desktop"
  "YouTube.desktop"
  "Zoom.desktop"
  "typora.desktop"
  "GitHub.desktop"
  "jan.desktop"
  "ChatGPT.desktop"
  # Launches lazydocker as root against the Docker daemon; Super+Shift+D is
  # rebound to Podman in the dotfiles. Re-created by omarchy-refresh-applications
  # on update, so it is also removed by the post-update hook.
  "Docker.desktop"
)
